<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stateside Smiles — Legal</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0f;
      color: #94a3b8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
    }
    .card {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(99, 102, 241, 0.2);
      border-radius: 16px;
      padding: 3rem;
      max-width: 400px;
    }
    h1 { font-size: 1.5rem; color: #f1f5f9; margin-bottom: 0.5rem; }
    p { margin-bottom: 1.5rem; font-size: 0.9rem; }
    a {
      display: block;
      padding: 0.75rem 1.5rem;
      margin: 0.5rem 0;
      border-radius: 8px;
      color: #e2e8f0;
      text-decoration: none;
      font-weight: 500;
      transition: background 0.2s;
    }
    a:first-of-type { background: rgba(99, 102, 241, 0.15); border: 1px solid rgba(99, 102, 241, 0.3); }
    a:last-of-type { background: rgba(236, 72, 153, 0.15); border: 1px solid rgba(236, 72, 153, 0.3); }
    a:hover { filter: brightness(1.3); }
  </style>
</head>
<body>
  <div class="card">
    <h1>Stateside Smiles</h1>
    <p>AI-powered video production platform</p>
    <a href="terms.html">📄 Terms of Service</a>
    <a href="privacy.html">🔒 Privacy Policy</a>
  </div>
</body>
</html>
