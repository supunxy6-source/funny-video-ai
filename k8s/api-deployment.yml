apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: ai-news-studio
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: ainewsstudio/backend:latest
          envFrom:
            - secretRef:
                name: ainews-secrets
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: ai-news-studio
spec:
  ports:
    - port: 8000
  selector:
    app: api
