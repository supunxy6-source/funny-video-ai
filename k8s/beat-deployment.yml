apiVersion: apps/v1
kind: Deployment
metadata:
  name: beat
  namespace: ai-news-studio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: beat
  template:
    metadata:
      labels:
        app: beat
    spec:
      containers:
        - name: beat
          image: ainewsstudio/backend:latest
          command: ["celery", "-A", "app.tasks.celery_app", "beat", "--loglevel=info"]
          envFrom:
            - secretRef:
                name: ainews-secrets
