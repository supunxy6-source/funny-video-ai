apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: ai-news-studio
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_DB
              value: ai_news_studio
            - name: POSTGRES_USER
              value: ainews
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ainews-secrets
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-storage
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ai-news-studio
spec:
  ports:
    - port: 5432
  selector:
    app: postgres
