apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: ai-news-studio
spec:
  replicas: 3
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: ainewsstudio/backend:latest
          command: ["celery", "-A", "app.tasks.celery_app", "worker", "--loglevel=info"]
          envFrom:
            - secretRef:
                name: ainews-secrets
